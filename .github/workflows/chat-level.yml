name: Chat Level - Quality Checks
on:
  push:
    branches: [main, feat/chat-level-pink-panel]
  pull_request:
    paths:
      - 'discord-bot/**'
      - '.github/workflows/chat-level.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: discord-bot
    env:
      DATABASE_URL: postgresql://tester:tester@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install audio test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Validate Prisma and generate client
        run: npx prisma validate && npx prisma generate
      - name: Check syntax
        run: |
          node --check src/index.js
          node --check src/events/messageCreate.js
          node --check src/events/interactionCreate.js
          node --check src/events/ready.js
          node --check src/utils/ticketPermissions.js
          node --check src/utils/antiLink.js
          node --check src/commands/ticket/convite.js
          node --check src/commands/ticket/ticket.js
          node --check src/utils/ticketInviteTemplate.js
          node --check src/utils/chatLevel.js
          node --check src/utils/chatLevelCard.js
          node --check src/utils/painelHandlers.js
          node --check src/utils/messageTriggers.js
          node --check src/utils/reactionTriggers.js
          node --check src/utils/communityRadio.js
          node --check src/utils/fmAudio.js
          node --check src/commands/general/fm.js
          node --check src/commands/general/musica.js
          node --check src/commands/general/radio.js
          node --check src/utils/musicManager.js
          node --check src/utils/radioManager.js
          node --check src/commands/general/nivel.js
          node --check src/utils/profileCard.js
          node --check src/commands/general/perfil.js
          node --check src/commands/interacoes/interacoes.js
          node --check src/commands/interacoes/foguinho.js
          node --check src/utils/interactionStreak.js
          node --check src/utils/interactionStreakCard.js
          node --check src/utils/interactionStreakArt.js
      - name: Prepare isolated test database
        run: npx prisma db push --skip-generate
      - name: Test XP rules and PNG rendering
        run: node --test test/chatLevelMath.test.js test/chatLevelCard.test.js test/profileStatIcons.test.js test/chatLevelIntegration.test.js test/interactionStreak.test.js test/ticketPermissions.test.js test/ticketInvite.test.js test/reactionTriggers.test.js test/communityRadio.test.js
